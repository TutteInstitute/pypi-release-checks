trigger:
  branches:
    include:
    - main

schedules:
  - cron: "0 0 * * *"
    displayName: "Nightly Test Runs"
    always: true
    branches:
      include:
        - main

stages:
  - stage: Check releases
    displayName: Check that Github releases make it to PyPI
    jobs:
      - job: run_platform_tests
        strategy:
          matrix:
            linux_py313:
              imageName: 'ubuntu-latest'
              python.version: '3.13'
        pool:
          vmImage: $(imageName)

        steps:
        - task: UsePythonVersion@0
          inputs:
            versionSpec: '$(python.version)'
          displayName: 'Use Python $(python.version)'

        - script: |
            python -m pip install --upgrade pip
            python -m pip install -U uv
            uv run check_releases.py            
          displayName: 'Install dependencies and run script'





